<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignalDesk</title>
    <link rel="stylesheet" href="/static/styles.css?v=2" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark"></span>
        <div>
          <h1>SignalDesk</h1>
          <p>Agentic incident desk for connectivity operations</p>
        </div>
      </div>
      <div class="pills">
        <span class="pill" id="health-mode">ServiceNow …</span>
        <span class="pill" id="health-count">0 incidents</span>
        <span class="pill">Azure-ready</span>
      </div>
    </header>
    <main class="desk">
      <section class="queue">
        <h2 style="padding: 16px 18px 0">Queue</h2>
        <div id="queue"></div>
      </section>
      <section class="detail" id="detail"></section>
      <section class="agent" id="agent"></section>
    </main>
    <script src="/static/app.js?v=2"></script>
  </body>
</html>
